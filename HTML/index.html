<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albert Lungu</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

  <!-- Your CSS (relative paths) -->
  <link rel="stylesheet" href="../CSS/background.css" />
  <link rel="stylesheet" href="../CSS/objects.css" />
  <link rel = "stylesheet" href = "../CSS/text.css" />
</head>

<body class="is-intro">
  <canvas id="bg"></canvas>

  <div class="hero-parallax" aria-hidden="true">
    <div class="parallax-layer parallax-layer--belts" data-depth="0.18">
      <span class="belt belt--one"></span>
      <span class="belt belt--two"></span>
      <span class="belt belt--three"></span>
    </div>

    <div class="parallax-layer parallax-layer--math" data-depth="0.28">
      <svg class="math-wave math-wave--primary" viewBox="0 0 1200 320" preserveAspectRatio="none">
        <path d="M0 170 Q 80 40 160 170 T 320 170 T 480 170 T 640 170 T 800 170 T 960 170 T 1120 170 T 1280 170" />
      </svg>
      <svg class="math-wave math-wave--secondary" viewBox="0 0 1200 320" preserveAspectRatio="none">
        <path d="M0 150 Q 90 220 180 150 T 360 150 T 540 150 T 720 150 T 900 150 T 1080 150 T 1260 150 T 1440 150" />
      </svg>
      <svg class="math-curve math-curve--tangent" viewBox="0 0 240 320" preserveAspectRatio="none">
        <path d="M40 320 C 90 280 110 240 122 200 C 134 150 138 90 140 10" />
      </svg>
    </div>

    <div class="parallax-layer parallax-layer--symbols" data-depth="0.36">
      <span class="math-symbol math-symbol--sigma">∑</span>
      <span class="math-symbol math-symbol--pi">π</span>
      <span class="math-symbol math-symbol--integral">∫</span>
      <span class="math-symbol math-symbol--phi">φ</span>
      <span class="math-symbol math-symbol--lambda">λ</span>
    </div>

    <div class="parallax-layer parallax-layer--snippets" data-depth="0.5">
      <span class="code-snippet code-snippet--one"><code>print("Hello World!")</code></span>
      <span class="code-snippet code-snippet--two"><code>while (true) { coffee++; }</code></span>
      <span class="code-snippet code-snippet--three"><code>git commit -m "final_final_v2"</code></span>
      <span class="code-snippet code-snippet--four"><code>// TODO: remove debug logs</code></span>
      <span class="code-snippet code-snippet--five"><code>try { ship(); } catch (bugs) { patch(); }</code></span>
    </div>
  </div>

  <main class="hero">
    <section class="hero-pill" id="heroPill">
      <div class="pill-scene">
        <canvas id="heroPillCanvas" aria-hidden="true"></canvas>
        <div class="pill-overlay" aria-live="polite">
          <article class="pill-overlay__face pill-overlay__face--active" data-face="0">
          </article>
        </div>
      </div>
      <div class="pill-shadow" aria-hidden="true"></div>
      <div class="pill-instruction">
        <span>Scroll to rotate</span>
        <span class="pill-instruction__icon">⇣</span>
      </div>
    </section>

    <div class="scroll-indicator">
      <span class="scroll-indicator__text">Scroll to explore</span>
      <svg class="scroll-indicator__arrow" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5V19M12 19L5 12M12 19L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </main>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="../JS/background.js"></script>
  <script type="module" src="../JS/heropill.js"></script>
  <script type="module" src="../JS/main-gradient.js"></script>
  <script src="../JS/main.js"></script>
</body>
</html>
